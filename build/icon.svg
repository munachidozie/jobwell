<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- JobWell icon. Blue gradient chip with a near-white "JW" monogram. Swap
       this and regenerate icon.ico/png via `node scripts/generate-icon.mjs`
       (or `pnpm icon`) when you have real logo artwork. -->
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aa0ff"/>
      <stop offset="1" stop-color="#3a74e6"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161d29"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#chip)"/>
  <rect x="18" y="18" width="220" height="220" rx="42" fill="url(#tile)"/>
  <text x="128" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="120"
        font-weight="700" text-anchor="middle" fill="#f2f6ff">JW</text>
</svg>
